name: Update NFL weekly hub
on:
  schedule:
    - cron: '17 7 * * 4'
    - cron: '17 7 * * 6'
    - cron: '17 10 * * 0'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build current NFL slate
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: npm run update
      - name: Commit refreshed data
        run: |
          git config user.name "NFL Weekly Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/week.json
          git diff --cached --quiet || git commit -m "Refresh NFL weekly data"
          git push
