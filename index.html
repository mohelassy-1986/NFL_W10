<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFL Match Centre · Cairo</title>

<style>
:root{
  --bg:#0d0f12;
  --surface:#15181d;
  --surface2:#1b1f25;
  --surface3:#22272e;
  --line:#292e36;
  --text:#f5f7fa;
  --muted:#858e99;

  --green:#32d583;
  --greenbg:#173627;

  --blue:#69adff;
  --purple:#bca8ff;

  --gold:#ffc857;
  --orange:#ff9c55;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:
    radial-gradient(circle at 50% 0,#1a1f27 0,#101318 33%,#0c0e11 75%);
  color:var(--text);
  font-family:
    Inter,system-ui,-apple-system,
    "Segoe UI",Roboto,Arial,sans-serif;
}

.wrap{
  max-width:1450px;
  margin:auto;
  padding:28px 18px 60px;
}


/* ================= HEADER ================= */

.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  margin-bottom:24px;
  gap:16px;
}

.title{
  font-size:32px;
  font-weight:900;
  letter-spacing:-1px;
}

.sub{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

.cairo{
  font-size:11px;
  font-weight:850;
  letter-spacing:.5px;

  color:#76e5aa;
  background:#122d20;

  border:1px solid #26583c;
  padding:8px 12px;
  border-radius:8px;
}


/* ================= FILTER BAR ================= */

.filters{
  display:flex;
  gap:7px;
  flex-wrap:wrap;

  border-bottom:1px solid var(--line);
  padding-bottom:15px;
  margin-bottom:18px;
}

.filters button{
  appearance:none;
  border:1px solid var(--line);
  background:#15181d;
  color:#aeb6c0;

  border-radius:8px;
  padding:8px 12px;

  font-size:12px;
  font-weight:750;

  cursor:pointer;
  transition:.15s;
}

.filters button:hover{
  background:#20242a;
  color:#fff;
}

.filters button.active{
  color:#101214;
  background:#f5f7fa;
  border-color:#f5f7fa;
}


/* ================= DATE ================= */

.day{
  display:flex;
  align-items:center;
  gap:10px;

  margin:25px 3px 9px;

  color:#e3e6ea;
  font-size:13px;
  font-weight:850;
}

.day:after{
  content:"";
  height:1px;
  background:#242932;
  flex:1;
}


/* ================= TABLE HEADER ================= */

.headers,
.game{
  display:grid;

  grid-template-columns:
    86px
    minmax(280px,1.8fr)
    84px
    62px
    92px
    96px
    108px
    94px
    minmax(225px,2fr);

  gap:10px;
}

.headers{
  padding:0 15px 7px;

  color:#6f7883;

  text-transform:uppercase;
  letter-spacing:.65px;

  font-size:9px;
  font-weight:850;
}

.si-head{
  color:#9584d8;
}


/* ================= GAME ================= */

.game{
  position:relative;
  align-items:center;

  min-height:78px;

  padding:11px 15px;

  background:var(--surface);
  border:1px solid var(--line);
  border-radius:10px;

  margin:6px 0;

  transition:
    background .15s,
    border-color .15s,
    transform .15s;
}

.game:hover{
  background:var(--surface2);
  border-color:#3b424d;
  transform:translateY(-1px);
}

.game.featured:before{
  content:"";
  position:absolute;

  left:-1px;
  top:13px;
  bottom:13px;

  width:3px;
  border-radius:0 4px 4px 0;

  background:var(--gold);
}


/* ================= TIME ================= */

.time{
  font-size:13px;
  font-weight:850;
  font-variant-numeric:tabular-nums;
}


/* ================= MATCHUP ================= */

.match{
  display:grid;

  grid-template-columns:
    minmax(100px,1fr)
    24px
    minmax(100px,1fr);

  align-items:center;
  gap:5px;
}

.team{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}

.team:last-child{
  justify-content:flex-start;
}

.logo-box{
  width:36px;
  height:36px;

  flex:none;

  display:flex;
  align-items:center;
  justify-content:center;
}

.team-logo{
  max-width:33px;
  max-height:33px;
  object-fit:contain;
}

.team-info{
  min-width:0;
}

.team-name{
  display:block;

  color:#f8f9fb;

  font-size:14px;
  font-weight:850;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.record{
  display:block;

  margin-top:2px;

  color:#7f8994;
  font-size:10.5px;
  font-weight:650;
}

.venue{
  text-align:center;

  color:#626b76;

  font-size:11px;
  font-weight:850;
}


/* ================= ODDS ================= */

.value{
  font-size:13px;
  font-weight:850;
  white-space:nowrap;
}

.spread{
  color:#78b7ff;
}

.ou.high{
  color:var(--orange);
}


/* ================= PICKS ================= */

.pick-cell{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:4px;
}

.expert{
  color:var(--green);
}

.si{
  color:var(--purple);
}

.vote{
  font-size:12.5px;
  font-weight:850;
  white-space:nowrap;
}

.consensus{
  display:inline-flex;
  align-items:center;

  border-radius:4px;
  padding:2px 5px;

  background:#183729;
  color:#66dda0;

  font-size:8px;
  font-weight:900;
  letter-spacing:.35px;
}

.unanimous{
  background:#1b392c;
  color:#72e9a9;
}

.split{
  background:#392e18;
  color:#ffd274;
}


/* ================= RATINGS ================= */

.rating-box{
  display:flex;
  align-items:center;
  gap:7px;
}

.rating-number{
  font-size:12px;
  font-weight:900;
  color:#e3e6ea;
  width:12px;
}

.rating-dots{
  display:flex;
  gap:3px;
}

.dot{
  width:6px;
  height:6px;

  border-radius:50%;

  background:#3b4149;
}

.dot.on.ent{
  background:var(--orange);
}

.dot.on.watch{
  background:var(--gold);
}


/* ================= WHY WATCH ================= */

.watch{
  color:#b2bac4;

  font-size:11.5px;
  line-height:1.42;

  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;

  overflow:hidden;
}


/* ================= MOBILE LABELS ================= */

.label{
  display:none;

  color:#727c87;

  font-size:9px;
  font-weight:800;

  text-transform:uppercase;
  letter-spacing:.6px;

  margin-bottom:3px;
}


/* ================= FOOTER ================= */

footer{
  margin-top:22px;

  color:#606975;
  font-size:11px;
}


/* ================= TABLET ================= */

@media(max-width:1050px){

  .headers{
    display:none;
  }

  .game{
    grid-template-columns:
      1fr 1fr 1fr;
    gap:14px;
  }

  .match{
    grid-column:1/-1;
  }

  .watch{
    grid-column:1/-1;

    border-top:1px solid var(--line);
    padding-top:10px;

    -webkit-line-clamp:unset;
  }

  .label{
    display:block;
  }
}


/* ================= PHONE ================= */

@media(max-width:620px){

  .wrap{
    padding:18px 10px 40px;
  }

  .top{
    align-items:flex-start;
    flex-direction:column;
  }

  .title{
    font-size:27px;
  }

  .game{
    grid-template-columns:1fr 1fr;
    padding:13px;
  }

  .match,
  .watch{
    grid-column:1/-1;
  }

  .match{
    grid-template-columns:
      minmax(100px,1fr)
      22px
      minmax(100px,1fr);

    padding-bottom:5px;
  }

  .team-logo{
    max-width:30px;
    max-height:30px;
  }

  .logo-box{
    width:31px;
  }

  .team-name{
    font-size:13px;
  }

  .filters{
    overflow-x:auto;
    flex-wrap:nowrap;

    padding-bottom:12px;

    scrollbar-width:none;
  }

  .filters::-webkit-scrollbar{
    display:none;
  }

  .filters button{
    white-space:nowrap;
  }
}
</style>
</head>


<body>

<main class="wrap">


<!-- HEADER -->

<section class="top">

  <div>

    <div class="title">
      NFL Match Centre
    </div>

    <div class="sub">
      Week 10 · Kickoff times converted to Cairo
    </div>

  </div>

  <div class="cairo">
    CAIRO · GMT+2
  </div>

</section>


<!-- FILTERS -->

<div class="filters">

<button
  class="active"
  onclick="filterGames('all',this)">
  All
</button>

<button
  onclick="filterGames('best',this)">
  🔥 Best games
</button>

<button
  onclick="filterGames('consensus',this)">
  ✓ Expert + SI agree
</button>

<button
  onclick="filterGames('unanimous',this)">
  10–0 SI picks
</button>

<button
  onclick="filterGames('highou',this)">
  O/U 50+
</button>

</div>


<!-- COLUMN HEADERS -->

<div class="headers">

<div>Cairo</div>
<div>Matchup</div>
<div>Spread</div>
<div>O/U</div>
<div>Experts</div>

<div class="si-head">
SI · 10 Writers
</div>

<div>Entertainment</div>
<div>Watch</div>
<div>Why it's worth watching</div>

</div>


<div id="list"></div>


<footer>
Ratings: 5 = highest · Orange = entertainment · Gold = overall watch rating
</footer>

</main>


<script>

/* ==========================================
   DATA
========================================== */

const games=[

[

'NYG -1.5','40.5',
'NYG 3–2','NYG',
'NYG 8–2','NYG',
4,3,
'An NFC East Thursday night divisional clash with a tight 2.5-point spread as the 5-2-1 Giants defend home turf against Washington.'
],

[

'Patriots','5-4','ne',
'vs',
'Lions','6-2','det',
'DET -2.5','50.5',
'DET 4–1','DET',
'DET 8–2','DET',
5,4,
'A high-scoring international showcase in Munich between two playoff contenders (5-4 Patriots vs. 6-2 Lions) with a 51.5 over/under.'
],

[
'Sun 15 Nov','8:00 PM',
'Chiefs','6-2','kc',
'@',
'Falcons','3-6','atl',
'KC -3.5','47.5',
'KC 4–1','KC',
'KC 10–0','KC',
4,4,
'Patrick Mahomes and the 6-2 Chiefs debut new wideout Josh Downs on the road against Atlanta in a tightly lined 3.5-point matchup.'
],

[
'Sun 15 Nov','8:00 PM',
'Texans','3-5','hou',
'@',
'Browns','5-4','cle',
'HOU -4.5','40.5',
'HOU 5–0','HOU',
'HOU 8–2','HOU',
3,3,
'C.J. Stroud and Houston try to climb back into the AFC wild-card picture against a resilient 5-4 Cleveland squad.'
],

[
'Sun 15 Nov','8:00 PM',
'Vikings','6-2','min',
'@',
'Packers','6-3','gb',
'GB -3','42.5',
'GB 5–0','GB',
'GB 9–1','GB',
4,5,
"A massive NFC North rivalry battle between 6-2 Minnesota and 6-3 Green Bay at Lambeau Field, highlighted by Kirk Cousins' return to the Vikings."
],

[
'Sun 15 Nov','8:00 PM',
'Dolphins','1-7','mia',
'@',
'Colts','2-7','ind',
'IND -3.5','38.5',
'IND 5–0','IND',
'MIA 6–4','MIA',
2,2,
'A low-total (37.5 O/U) AFC matchup between two struggling squads (1-7 Miami and 2-7 Indianapolis) playing for pride.'
],

[
'Sun 15 Nov','8:00 PM',
'Panthers','3-5','car',
'@',
'Saints','3-5','no',
'NO -2.5','48.5',
'CAR 4–1','CAR',
'CAR 6–4','CAR',
5,2,
'Both 3-5 teams are knotted near the top of a wide-open NFC South, giving an otherwise low-profile game real division stakes.'
],

[
'Sun 15 Nov','8:00 PM',
'Bills','7-1','buf',
'@',
'Jets','2-7','nyj',
'BUF -7.5','50.5',
'BUF 5–0','BUF',
'BUF 10–0','BUF',
4,3,
"Josh Allen and the 7-1 Bills bring one of the league's most explosive offenses to New Jersey as 7.5-point favorites over the 2-7 Jets."
],

[
'Sun 15 Nov','8:00 PM',
'Jaguars','6-2','jax',
'@',
'Titans','1-7','ten',
'JAX -10.5','46.5',
'JAX 5–0','JAX',
'JAX 10–0','JAX',
3,3,
'The surging 6-2 Jaguars debut three trade-deadline defensive acquisitions as heavy 10.5-point favorites over 1-7 Tennessee.'
],

[
'Sun 15 Nov','11:05 PM',

'@',

'LAR -9.5','39.5',

2,3,
'The 5-4 Rams look to keep pace in the NFC West wild-card hunt as 9.5-point road favorites in Arizona.'
],

[
'Sun 15 Nov','11:05 PM',
'Seahawks','5-4','sea',

'Raiders','4-5','lv',
'SEA -6.5','40.5',

'SEA 9–1','SEA',
2,3,

],

[
'Sun 15 Nov','11:25 PM',
'49ers','7-1','sf',
'@',
'Cowboys','4-5','dal',
'SF -4.5','55.5',
'SF 5–0','SF',
'SF 9–1','SF',
5,5,
"The week's highest projected shootout (55.5 O/U) pits the 7-1 49ers—bolstered by Nick Bosa and DeForest Buckner—against Dallas."
],

[
'Mon 16 Nov','3:20 AM',
'Steelers','6-2','pit',

5,5,
"Sunday Night Football features a deadlocked battle for first place in the AFC North between two 6-2 rivals led by Joe Burrow and Pittsburgh's defense."
],

[

'BAL 5–5 LAC','TIE',
2,2,
'Monday Night Football features the 4-5 Ravens trying to hold the fort without Lamar Jackson against the winless 0-8 Chargers.'
]

];


/* ==========================================
   HELPERS
========================================== */

function logo(team){
  return `https://a.espncdn.com/i/teamlogos/nfl/500/${team}.png`;
}


function ratingDots(score,type){

  let dots='';

  for(let i=1;i<=5;i++){

    dots+=`
      <span class="dot ${
        i<=score
        ? `on ${type}`
        : ''
      }"></span>
    `;

  }

  return `
    <div class="rating-box">

      <span class="rating-number">
        ${score}
      </span>

      <div class="rating-dots">
        ${dots}
      </div>

    </div>
  `;
}


function voteTag(expertPick,siPick,siVotes){

  if(siPick==='TIE'){

    return `
      <span class="consensus split">
        SPLIT
      </span>
    `;

  }

  if(siVotes.includes('10–0')){

    return `
      <span class="consensus unanimous">
        UNANIMOUS
      </span>
    `;

  }

  if(expertPick===siPick){

    return `
      <span class="consensus">
        AGREE
      </span>
    `;

  }

  return '';

}


/* ==========================================
   RENDER
========================================== */

function render(mode='all'){

let html='';
let last='';

for(const g of games){

const[
day,time,

team1,record1,logo1,
venue,
team2,record2,logo2,

spread,ou,

experts,
expertPick,

siVotes,
siPick,

entertainment,
watchRating,

why
]=g;


/* FILTERS */

if(
  mode==='best' &&
  entertainment<5 &&
  watchRating<5
) continue;


if(
  mode==='consensus' &&
  expertPick!==siPick
) continue;


if(
  mode==='unanimous' &&
  !siVotes.includes('10–0')
) continue;


if(
  mode==='highou' &&
  +ou<50
) continue;


/* DATE */

if(day!==last){

html+=`
<div class="day">
  ${day}
</div>
`;

last=day;

}


const featured =
  entertainment===5 ||
  watchRating===5;


html+=`

<article class="game ${featured ? 'featured' : ''}">


<!-- TIME -->

<div>

<span class="label">
Cairo
</span>

<span class="time">
${time}
</span>

</div>


<!-- MATCHUP -->

<div class="match">


<div class="team">

<div class="logo-box">

<img
class="team-logo"
src="${logo(logo1)}"
alt="${team1}">

</div>

<div class="team-info">

<span class="team-name">
${team1}
</span>

<span class="record">
${record1}
</span>

</div>

</div>


<div class="venue">
${venue}
</div>


<div class="team">

<div class="logo-box">

<img
class="team-logo"
src="${logo(logo2)}"
alt="${team2}">

</div>

<div class="team-info">

<span class="team-name">
${team2}
</span>

<span class="record">
${record2}
</span>

</div>

</div>


</div>


<!-- SPREAD -->

<div>

<span class="label">
Spread
</span>

<span class="value spread">
${spread}
</span>

</div>


<!-- O/U -->

<div>

<span class="label">
O/U
</span>

<span class="value ou ${+ou>=50?'high':''}">
${ou}
</span>

</div>


<!-- EXPERT -->

<div class="pick-cell">

<span class="label">
Experts
</span>

<span class="vote expert">
${experts}
</span>

</div>


<!-- SI -->

<div class="pick-cell">

<span class="label">
SI · 10 Writers
</span>

<span class="vote si">
${siVotes}
</span>

${voteTag(
  expertPick,
  siPick,
  siVotes
)}

</div>


<!-- ENTERTAINMENT -->

<div>

<span class="label">
Entertainment
</span>

${ratingDots(
  entertainment,
  'ent'
)}

</div>


<!-- WATCH -->

<div>

<span class="label">
Watch rating
</span>

${ratingDots(
  watchRating,
  'watch'
)}

</div>


<!-- WHY -->

<div class="watch">

<span class="label">
Why watch
</span>

${why}

</div>


</article>

`;

}

document
.getElementById('list')
.innerHTML=html;

}


/* ==========================================
   FILTER HANDLER
========================================== */

function filterGames(mode,button){

document
.querySelectorAll('.filters button')
.forEach(
  b=>b.classList.remove('active')
);

button.classList.add('active');

render(mode);

}


render();

</script>

</body>
</html>
