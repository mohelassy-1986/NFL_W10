<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>NFL Cairo Auto Hub</title>
  <meta name="description" content="NFL schedule in Cairo time, team records, broadcasts, lines, and Watch Scores.">
  <meta name="theme-color" content="#090c11" id="themeMeta">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NFL Cairo">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">
  <script>
    // Apply saved or system theme immediately before paint to prevent flash
    (function() {
      const saved = localStorage.getItem('nfl-cairo-theme');
      const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
      const theme = saved || (prefersLight ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
      const meta = document.getElementById('themeMeta');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#f3f6fa' : '#090c11');
    })();
  </script>
  <style>
    :root {
      --bg: #090c11;
      --bg-grad: radial-gradient(circle at 50% -10%, #1b2a3c 0%, #0c1118 38%, #080b0f 78%);
      --card: #141a23;
      --card-sub: #0f141c;
      --chip-bg: #171f2a;
      --chip-border: #303b4b;
      --line: #293342;
      --txt: #f5f7fb;
      --txt-soft: #b5bfcb;
      --mut: #8d99a8;
      --g: #46dc92;
      --g-bg: #153225;
      --g-border: #32624b;
      --gold: #ffc857;
      --gold-grad: linear-gradient(145deg, #2c2615, #141a23);
      --gold-border: #665526;
      --blue: #6eb0ff;
      --blue-bg: #172c48;
      --orange: #ff9352;
      --orange-bg: #402c1b;
      --red: #ff6675;
      --red-bg: #351a20;
      --red-border: #71333b;
      --btn-bg: #151b24;
      --btn-txt: #b8c1cd;
      --btn-active-bg: #ffffff;
      --btn-active-txt: #10141a;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }

    [data-theme="light"] {
      --bg: #f3f6fa;
      --bg-grad: linear-gradient(180deg, #e7eef7 0%, #f3f6fa 35%, #f3f6fa 100%);
      --card: #ffffff;
      --card-sub: #f6f8fb;
      --chip-bg: #eef2f7;
      --chip-border: #d5dde8;
      --line: #dce3ed;
      --txt: #101828;
      --txt-soft: #344054;
      --mut: #667085;
      --g: #0d9454;
      --g-bg: #e6f7ef;
      --g-border: #9be0be;
      --gold: #b46900;
      --gold-grad: linear-gradient(145deg, #fff8e6, #ffffff);
      --gold-border: #f2cf7e;
      --blue: #175cd3;
      --blue-bg: #e8f1ff;
      --orange: #c4320a;
      --orange-bg: #ffefe8;
      --red: #d92d20;
      --red-bg: #fef3f2;
      --red-border: #fecdca;
      --btn-bg: #ffffff;
      --btn-txt: #344054;
      --btn-active-bg: #101828;
      --btn-active-txt: #ffffff;
      --shadow: 0 2px 10px rgba(16, 24, 40, 0.06);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      background: var(--bg);
      background-image: var(--bg-grad);
      background-attachment: fixed;
      color: var(--txt);
      font: 14px/1.45 Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .wrap {
      max-width: 1280px;
      margin: auto;
      padding: calc(20px + env(safe-area-inset-top)) 16px calc(56px + env(safe-area-inset-bottom));
    }

    /* Header */
    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      flex-wrap: wrap;
    }

    .brand { flex: 1; min-width: 240px; }

    .eyebrow {
      color: var(--g);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1.3px;
      text-transform: uppercase;
    }

    .top h1 {
      margin: 4px 0 4px;
      font-size: clamp(26px, 4vw, 35px);
      letter-spacing: -1px;
      line-height: 1.1;
    }

    .top p {
      margin: 0;
      color: var(--mut);
      font-size: 13px;
    }

    .topActions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status {
      border: 1px solid var(--g-border);
      background: var(--g-bg);
      color: var(--g);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .status.error {
      border-color: var(--red-border);
      background: var(--red-bg);
      color: var(--red);
    }

    .iconBtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 35px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--btn-bg);
      color: var(--txt);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.1s ease, border-color 0.2s ease;
    }

    .iconBtn:active { transform: scale(0.96); }
    .iconBtn.install {
      background: var(--blue-bg);
      color: var(--blue);
      border-color: transparent;
      display: none;
    }

    /* Offline Banner */
    .offlineBar {
      display: none;
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 10px;
      background: var(--orange-bg);
      color: var(--orange);
      font-size: 12px;
      font-weight: 700;
      border: 1px solid rgba(255, 147, 82, 0.3);
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 18px 0 14px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .controls::-webkit-scrollbar { display: none; }

    .controls select,
    .controls button {
      flex-shrink: 0;
      height: 38px;
      border: 1px solid var(--line);
      background: var(--btn-bg);
      color: var(--btn-txt);
      padding: 0 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      box-shadow: var(--shadow);
      transition: all 0.15s ease;
    }

    .controls select {
      color: var(--txt);
      padding-right: 28px;
      cursor: pointer;
    }

    .controls button { cursor: pointer; }
    .controls button:active { transform: scale(0.96); }

    .controls button.active {
      background: var(--btn-active-bg);
      color: var(--btn-active-txt);
      border-color: var(--btn-active-bg);
    }

    /* Collapsible Guides */
    details.drawer {
      margin: 10px 0;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    details.drawer summary {
      list-style: none;
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    details.drawer summary::-webkit-details-marker { display: none; }
    details.drawer summary::after {
      content: "▾";
      font-size: 14px;
      color: var(--mut);
      transition: transform 0.2s ease;
    }
    details.drawer[open] summary::after { transform: rotate(180deg); }

    .drawerBody {
      padding: 0 14px 14px;
      border-top: 1px solid var(--line);
      padding-top: 12px;
    }

    .guide {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .guideItem {
      background: var(--card-sub);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px;
    }

    .guideItem b {
      display: block;
      color: var(--txt);
      font-size: 12px;
      margin-bottom: 4px;
    }
