<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>NFL Week — Cairo Time</title>
<style>
:root{--bg:#0f1115;--card:#181b20;--card2:#20242a;--text:#f5f7fa;--muted:#9aa3ad;--line:#2c3138;--green:#32d583;--yellow:#ffc857;--blue:#59a5ff;--red:#ff6677}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0b0d10,#13161b);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 18px 56px}.top{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:22px}.title{font-size:30px;font-weight:850;letter-spacing:-.8px}.sub{color:var(--muted);margin-top:5px}.badge{background:#183526;color:#6fe5a2;border:1px solid #295a3d;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:800}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.filters button{border:1px solid var(--line);color:#cdd3da;background:#171a1f;border-radius:999px;padding:8px 13px;cursor:pointer}.filters button.active{background:#fff;color:#111;border-color:#fff}.day{color:#d7dce2;font-weight:850;font-size:14px;margin:24px 0 9px}.game{display:grid;grid-template-columns:110px 1.7fr 90px 82px 100px 105px 90px 2.5fr;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 15px;margin:8px 0;transition:.18s}.game:hover{background:var(--card2);transform:translateY(-1px);border-color:#3b424b}.time{font-weight:850;font-size:14px}.match{font-weight:850}.at{color:var(--muted);font-weight:600}.label{display:none;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.7px}.num{font-weight:800;font-variant-numeric:tabular-nums}.votes{color:var(--green);font-weight:850}.stars{color:var(--yellow);letter-spacing:1px;white-space:nowrap}.watch{color:#c7cdd4;font-size:13px;line-height:1.4}.hot{box-shadow:inset 3px 0 0 var(--yellow)}.highou{color:#ff9f5a}.pick{color:#75b7ff}.headers{display:grid;grid-template-columns:110px 1.7fr 90px 82px 100px 105px 90px 2.5fr;gap:12px;padding:0 15px;color:#7f8994;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.7px}footer{margin-top:22px;color:#707983;font-size:12px}@media(max-width:850px){.headers{display:none}.game{grid-template-columns:1fr 1fr;gap:10px}.match,.watch{grid-column:1/-1}.label{display:block;margin-bottom:2px}.watch{padding-top:8px;border-top:1px solid var(--line)}.top{align-items:start;flex-direction:column}}
</style>
</head><body><main class="wrap"><section class="top"><div><div class="title">NFL Match Centre</div><div class="sub">Week slate · All kickoff times in Cairo (GMT+2)</div></div><div class="badge">CAIRO TIME</div></section>
<div class="filters"><button class="active" onclick="filterGames('all',this)">All games</button><button onclick="filterGames('elite',this)">★★★★★ entertainment</button><button onclick="filterGames('stars5',this)">5-star watch</button><button onclick="filterGames('highou',this)">O/U 50+</button></div>
<div class="headers"><div>Time</div><div>Matchup</div><div>Spread</div><div>O/U</div><div>Experts</div><div>Entertainment</div><div>Star rating</div><div>Why watch</div></div>
<div id="list"></div><footer>Designed as a dark, compact football score centre inspired by modern match apps. Data shown exactly as supplied.</footer></main>
<script>
const games=[
['Fri 13 Nov','3:15 AM','Commanders','Giants','NYG -1.5','40.5','NYG 3–2',4,3,"An NFC East Thursday night divisional clash with a tight 2.5-point spread as the 5-2-1 Giants defend home turf against Washington."],
['Sun 15 Nov','4:30 PM','Patriots','Lions','DET -2.5','50.5','DET 4–1',5,4,"A high-scoring international showcase in Munich between two playoff contenders (5-4 Patriots vs. 6-2 Lions) with a 51.5 over/under."],
['Sun 15 Nov','8:00 PM','Chiefs','Falcons','KC -3.5','47.5','KC 4–1',4,4,"Patrick Mahomes and the 6-2 Chiefs debut new wideout Josh Downs on the road against Atlanta in a tightly lined 3.5-point matchup."],
['Sun 15 Nov','8:00 PM','Texans','Browns','HOU -4.5','40.5','HOU 5–0',3,3,"C.J. Stroud and Houston try to climb back into the AFC wild-card picture against a resilient 5-4 Cleveland squad."],
['Sun 15 Nov','8:00 PM','Vikings','Packers','GB -3','42.5','GB 5–0',4,5,"A massive NFC North rivalry battle between 6-2 Minnesota and 6-3 Green Bay at Lambeau Field, highlighted by Kirk Cousins' return to the Vikings."],
['Sun 15 Nov','8:00 PM','Dolphins','Colts','IND -3.5','38.5','IND 5–0',2,2,"A low-total (37.5 O/U) AFC matchup between two struggling squads (1-7 Miami and 2-7 Indianapolis) playing for pride."],
['Sun 15 Nov','8:00 PM','Panthers','Saints','NO -2.5','48.5','CAR 4–1',5,2,"Both 3-5 teams are knotted near the top of a wide-open NFC South, giving an otherwise low-profile game real division stakes."],
['Sun 15 Nov','8:00 PM','Bills','Jets','BUF -7.5','50.5','BUF 5–0',4,3,"Josh Allen and the 7-1 Bills bring one of the league's most explosive offenses to New Jersey as 7.5-point favorites over the 2-7 Jets."],
['Sun 15 Nov','8:00 PM','Jaguars','Titans','JAX -10.5','46.5','JAX 5–0',3,3,"The surging 6-2 Jaguars debut three trade-deadline defensive acquisitions as heavy 10.5-point favorites over 1-7 Tennessee."],
['Sun 15 Nov','11:05 PM','Rams','Cardinals','LAR -9.5','39.5','LAR 5–0',2,3,"The 5-4 Rams look to keep pace in the NFC West wild-card hunt as 9.5-point road favorites in Arizona."],
['Sun 15 Nov','11:05 PM','Seahawks','Raiders','SEA -6.5','40.5','SEA 5–0',2,3,"The 5-4 Seahawks head to Las Vegas in a competitive inter-conference spot where Seattle needs a win to stay in the NFC playoff mix."],
['Sun 15 Nov','11:25 PM','49ers','Cowboys','SF -4.5','55.5','SF 5–0',5,5,"The week's highest projected shootout (55.5 O/U) pits the 7-1 49ers—bolstered by Nick Bosa and DeForest Buckner—against Dallas."],
['Mon 16 Nov','3:20 AM','Steelers','Bengals','CIN -3.5','49.5','CIN 5–0',5,5,"Sunday Night Football features a deadlocked battle for first place in the AFC North between two 6-2 rivals led by Joe Burrow and Pittsburgh's defense."],
['Tue 17 Nov','3:15 AM','Chargers','Ravens','BAL -4.5','38.5','BAL 5–0',2,2,"Monday Night Football features the 4-5 Ravens trying to hold the fort without Lamar Jackson against the winless 0-8 Chargers."]];
function render(mode='all'){let html='',last='';for(const g of games){const [day,time,a,b,spread,ou,votes,e,s,why]=g;if(mode==='elite'&&e!==5)continue;if(mode==='stars5'&&s!==5)continue;if(mode==='highou'&&+ou<50)continue;if(day!==last){html+=`<div class="day">${day}</div>`;last=day}html+=`<article class="game ${e===5||s===5?'hot':''}"><div><span class="label">Cairo</span><span class="time">${time}</span></div><div class="match">${a} <span class="at">@</span> ${b}</div><div><span class="label">Spread</span><span class="num pick">${spread}</span></div><div><span class="label">O/U</span><span class="num ${+ou>=50?'highou':''}">${ou}</span></div><div><span class="label">Experts</span><span class="votes">${votes}</span></div><div><span class="label">Entertainment</span><span class="stars">${'★'.repeat(e)}${'☆'.repeat(5-e)}</span></div><div><span class="label">Watch</span><span class="stars">${'★'.repeat(s)}${'☆'.repeat(5-s)}</span></div><div class="watch">${why}</div></article>`}document.getElementById('list').innerHTML=html}
function filterGames(mode,btn){document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render(mode)}render();
</script></body></html>
